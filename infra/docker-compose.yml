services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_platform
    ports: ["5432:5432"]
    volumes: ["./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql", "pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U agent"], interval: 5s, retries: 5 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 5 }

  api:
    build: ../apps/api
    ports: ["8000:8000"]
    env_file: ../.env.example
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    volumes: ["../packages:/app/packages"] # live import trace
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  trace-ui:
    build: ../apps/trace-ui
    ports: ["3000:3000"]
    environment: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    depends_on: [api]

volumes: { pgdata: {} }