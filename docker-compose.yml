services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_platform
    ports: ["5432:5432"]
    volumes: ["./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql", "pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U agent"], interval: 5s, retries: 5 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 5 }
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    environment:
      # Sandbox image is built separately (see Makefile below); point at it by name
      SANDBOX_IMAGE: "agent-sandbox:latest"
      ARTIFACT_DIR: "/app/data/artifacts"
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    volumes:
      # The sandbox manager runs ephemeral containers via the docker socket
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./packages:/app/packages"
      - "./apps/api:/app/apps/api"
      # Host-visible artifacts dir (served by /artifacts/{run_id}/{name})
      - "./data/artifacts:/app/data/artifacts"
  trace-ui:
    build:
      context: .
      dockerfile: apps/trace-ui/Dockerfile
    ports: ["3000:3000"]
    environment: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    depends_on: [api]

volumes: { pgdata: {} }
