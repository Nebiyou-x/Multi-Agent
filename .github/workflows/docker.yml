# CD: build and push the three runtime images to GitHub Container Registry.
# - `ci.yml` already proves the Dockerfiles build; this job adds the push + tags.
# - Triggers: manually (Actions UI), or automatically on main after CI is green.
# - Images: ghcr.io/<owner>/<repo>/{agent-sandbox,agent-api,agent-trace-ui}:latest + :<sha7>
# - docker-compose consumers should pin the :<sha7> tag in production, :latest in dev.
name: Docker

on:
  # Manual cut
  workflow_dispatch:

  # Automatic: after the CI workflow is green on main
  workflow_run:
    workflows: ["CI"]
    type: completed
    branches: [main]

permissions:
  contents: read
  packages: write
  actions: write # GHA docker layer cache (cache-to: type=gha)

env:
  REGISTRY: ghcr.io

jobs:
  # Re-run the Python gate for manual pushes (skip when triggered by CI, which
  # just ran it - no point duplicating).
  check:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -m "not integration"

  images:
    runs-on: ubuntu-latest
    needs: check
    if: always() && (needs.check.result == 'success' || needs.check.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          # api + trace-ui COPY from apps/... so they need the repo-root context;
          # the sandbox image is self-contained, so a small context suffices.
          - name: agent-sandbox
            dockerfile: infra/sandbox-image/Dockerfile
            context: infra/sandbox-image
          - name: agent-api
            dockerfile: apps/api/Dockerfile
            context: .
          - name: agent-trace-ui
            dockerfile: apps/trace-ui/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI references must be all-lowercase but GITHUB_REPOSITORY keeps its
      # case ("Nebiyou-x/Multi-Agent") - the registry would reject uppercase.
      - name: Compute image refs
        run: |
          echo "OCI_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SHA_SHORT=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      # :latest for compose pull, short-SHA tag for reproducible pinning.
      # NOTE: `with:` inputs are expressions, not shell - $VAR does NOT expand.
      - name: Push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OCI_REPO }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.OCI_REPO }}/${{ matrix.name }}:${{ env.SHA_SHORT }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
